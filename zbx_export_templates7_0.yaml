zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: Templates/Modules
  templates:
    - uuid: b3b4420140254b74a6a2954ab85c59f2
      template: 'SMART by Zabbix agent 2 by Silureth'
      name: 'SMART by Zabbix agent 2 by Silureth'
      description: |-
        Monitors S.M.A.R.T. data of physical disks (HDD, SSD, NVMe, including disks behind RAID controllers) with the built-in smart plugin of Zabbix agent 2. No external scripts or custom agent builds are needed. Based on the official "SMART by Zabbix agent 2" template.

        Setup:

        1. Install Zabbix agent 2 (7.0 or newer) and smartmontools 7.1 or newer.

        2. Make sure the agent can find the "smartctl" executable. Either have its folder in the agent's PATH, or set the full path in the agent configuration file:
        Plugins.Smart.Path=/usr/sbin/smartctl

        3. Allow the zabbix user to run smartctl as root without a password (Linux). Run "visudo" and add:
        zabbix ALL=(ALL) NOPASSWD:/usr/sbin/smartctl

        4. Check on the host that the agent sees the disks:
        zabbix_agent2 -t smart.disk.discovery

        5. Link the template to the host. Disks are discovered every hour; SMART data is polled every {$SMART.DISK.GET.INTERVAL} (default 1h).

        Per-disk settings use macro context. The context is the disk name shown in the item names, e.g. "sda cciss,3" or "nvme0":
        - {$SMART.WEAROUT.INVERT:"<disk>"} = 1 for disks whose Media_Wearout_Indicator counts up from 0 (new) to 100 (worn out), mostly newer WD models.
        - {$SMART.TBW.UNIT.BYTES:"<disk>"} = 1073741824 for disks that report Total_LBAs_Written in GiB instead of 512-byte sectors (e.g. WD Red SA500).
        - {$SMART.TBW.SUSPECT:"<disk>"} = a higher limit (e.g. 5000T) for enterprise SSDs rated for many petabytes, so they don't trip the "shows no wear after heavy writes" alert.
        On HP Smart Array (cciss) hosts set {$SMART.DISK.NAME.NOT_MATCHES} to " scsi$" to skip the controller's logical volume, which has no SMART data.

        Changes compared to the official template:
        - SSD endurance items: Wear_Leveling_Count (Samsung), SSD_Life_Left (Kingston), Media_Wearout_Indicator (WD), Percent_Lifetime_Remain (Micron/Crucial). All are stored as "% life remaining" (100 = new) and alert below {$SMART.WEAR_LEVEL.WARN}, {$SMART.WEAR_LEVEL.AVG} and {$SMART.WEAR_LEVEL.CRIT} (default 30/20/10%).
        - Total bytes written per disk (from Total_LBAs_Written or Host_Writes_GiB). No write-limit triggers, since SSD wear is alerted by the wear-level items; instead it flags a wear counter that does not move: more than {$SMART.TBW.SUSPECT} (default 500T) written while the wear item still shows 99-100% remaining.
        - Failure attribute items and triggers: Current_Pending_Sector, Offline_Uncorrectable, Uncorrectable_Error_Cnt, Runtime_Bad_Block, UDMA_CRC_Error_Count / CRC_Error_Count (interface errors, usually cable or backplane), plus alerts when Reallocated_Sector_Ct or Reported_Uncorrect increase. "Increased" alerts stay open until closed manually.
        - Disk age triggers on power-on hours ({$SMART.OLDAGE.WARN} / {$SMART.OLDAGE.AVG} / {$SMART.OLDAGE.CRIT}), with the disk type as macro context: 8 / 10 / 12 years for HDDs, 6 / 7 / 8 years for SSD and NVMe. Age is a secondary indicator that still alerts when a disk's wear counter is wrong. Override on a host per type, e.g. {$SMART.OLDAGE.WARN:"ssd"}.
        - Configurable polling interval ({$SMART.DISK.GET.INTERVAL}) and triggers that use the latest value, suited to hourly polling.
        - Vendor attribute items are created only when the disk reports that attribute.

        Source and notes: https://github.com/Silureth/zabbix-agent2-smart-raw
      groups:
        - name: Templates/Modules
      discovery_rules:
        - uuid: 8bd36dd084c24a09a1fd741143484094
          name: 'Disk discovery'
          key: smart.disk.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#NAME}'
                value: '{$SMART.DISK.NAME.MATCHES}'
                formulaid: A
              - macro: '{#NAME}'
                value: '{$SMART.DISK.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery SMART disks.'
          item_prototypes:
            - uuid: cb7a29577c404bd28ee0e42a3c714bee
              name: 'SMART [{#NAME}]: Bad_Block_Rate'
              type: DEPENDENT
              key: 'smart.disk.attribute.bad_block_rate[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'Percentage of used reserve blocks divided by total reserve blocks.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.bad_block_rate.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: b0514ddb39cd47ef979baa5b22133876
              name: 'SMART [{#NAME}]: CRC_Error_Count'
              type: DEPENDENT
              key: smart.disk.attribute.crc_error_count[{#NAME}]
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: Interface CRC errors (Samsung). Usually caused by a cable, backplane or controller problem, not the disk itself.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.crc_error_count.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: smart.disk.get[{#PATH},"{#RAIDTYPE}"]
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 2d876f03fef04ec2a3975da26b4f24fc
                  expression: change(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.crc_error_count[{#NAME}])>0
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Interface CRC errors increased (check cable/backplane)'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: Interface CRC errors (Samsung). Usually caused by a cable, backplane or controller problem, not the disk itself. Close manually after review.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 20bf4add41b44ad48852c580dc2ffa7f
              name: 'SMART [{#NAME}]: Current_Pending_Sector'
              type: DEPENDENT
              key: smart.disk.attribute.current_pending_sector[{#NAME}]
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: Number of unstable sectors waiting to be remapped.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.current_pending_sector.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: smart.disk.get[{#PATH},"{#RAIDTYPE}"]
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 8328475f3a214d38bbf1698f8dd45a94
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.current_pending_sector[{#NAME}])>0
                  name: 'SMART [{#NAME}]: Disk has pending (unstable) sectors'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: Number of unstable sectors waiting to be remapped.
                  tags:
                    - tag: scope
                      value: notice
            - uuid: a0da485316d34c84a4380f4dbff020bb
              name: 'SMART [{#NAME}]: Media_Wearout_Indicator'
              type: DEPENDENT
              key: 'smart.disk.attribute.media_wearout_indicator[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: |-
                Normalized Media_Wearout_Indicator: percentage of rated endurance remaining, 100 = new.
                Some (mostly newer WD) models count the other way (0 = new, 100 = worn out). For those disks set
                {$SMART.WEAROUT.INVERT:"<disk name>"} to 1 on the host, e.g. {$SMART.WEAROUT.INVERT:"sda cciss,3"} = 1.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.media_wearout_indicator.normalized_value
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |-
                      // {$SMART.WEAROUT.INVERT} = 1 for disks that count up from 0 (new) to 100 (worn out).
                      return {$SMART.WEAROUT.INVERT:"{#NAME}"} == 1 ? 100 - value : value;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              units: '%'
              trigger_prototypes:
                - uuid: 4fd445bf7bb047c2a03dbca7fbd4d6c4
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.media_wearout_indicator[{#NAME}])<{$SMART.WEAR_LEVEL.CRIT}
                  name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining is critically low'
                  event_name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining is critically low (<{$SMART.WEAR_LEVEL.CRIT})'
                  opdata: 'Remaining: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  tags:
                    - tag: scope
                      value: notice
                - uuid: a98b391a24f64bf9b17d29a55a7a8390
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.media_wearout_indicator[{#NAME}])<{$SMART.WEAR_LEVEL.AVG}
                  name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining is getting low'
                  event_name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining is getting low (<{$SMART.WEAR_LEVEL.AVG})'
                  opdata: 'Remaining: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  dependencies:
                    - name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining is critically low'
                      expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.media_wearout_indicator[{#NAME}])<{$SMART.WEAR_LEVEL.CRIT}
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 98995d8002dd48a4b9c58a4208372802
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.media_wearout_indicator[{#NAME}])<{$SMART.WEAR_LEVEL.WARN}
                  name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining needs attention'
                  event_name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining needs attention (<{$SMART.WEAR_LEVEL.WARN})'
                  opdata: 'Remaining: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  dependencies:
                    - name: 'SMART [{#NAME}]: Media_Wearout_Indicator life remaining is getting low'
                      expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.media_wearout_indicator[{#NAME}])<{$SMART.WEAR_LEVEL.AVG}
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 98ef10fdb08d4d8bad783722279b365f
              name: 'SMART [{#NAME}]: Offline_Uncorrectable'
              type: DEPENDENT
              key: smart.disk.attribute.offline_uncorrectable[{#NAME}]
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: Number of uncorrectable errors found during offline scan.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.offline_uncorrectable.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: smart.disk.get[{#PATH},"{#RAIDTYPE}"]
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: d82255127d2a47f19e9bc249ed7a8599
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.offline_uncorrectable[{#NAME}])>0
                  name: 'SMART [{#NAME}]: Disk has offline uncorrectable sectors'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: Number of uncorrectable errors found during offline scan.
                  tags:
                    - tag: scope
                      value: notice
            - uuid: ab32e2eb82564fc08b58ad309cb7f665
              name: 'SMART [{#NAME}]: Percent_Lifetime_Remain'
              type: DEPENDENT
              key: smart.disk.attribute.percent_lifetime_remain[{#NAME}]
              delay: '0'
              history: 7d
              units: '%'
              discover: NO_DISCOVER
              description: 'Normalized Percent_Lifetime_Remain (Micron/Crucial): percentage of rated endurance remaining, 100 = new.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.percent_lifetime_remain.normalized_value
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: smart.disk.get[{#PATH},"{#RAIDTYPE}"]
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 17715534b1e54d7aa067f131792649fa
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.percent_lifetime_remain[{#NAME}])<{$SMART.WEAR_LEVEL.CRIT}
                  name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining is critically low'
                  event_name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining is critically low (<{$SMART.WEAR_LEVEL.CRIT})'
                  opdata: 'Remaining: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 72a32d0702f645728a10bb2c7ee598ca
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.percent_lifetime_remain[{#NAME}])<{$SMART.WEAR_LEVEL.AVG}
                  name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining is getting low'
                  event_name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining is getting low (<{$SMART.WEAR_LEVEL.AVG})'
                  opdata: 'Remaining: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  dependencies:
                    - name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining is critically low'
                      expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.percent_lifetime_remain[{#NAME}])<{$SMART.WEAR_LEVEL.CRIT}
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 838454f29fc045f0b06ab1bc5e0d3ff5
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.percent_lifetime_remain[{#NAME}])<{$SMART.WEAR_LEVEL.WARN}
                  name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining needs attention'
                  event_name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining needs attention (<{$SMART.WEAR_LEVEL.WARN})'
                  opdata: 'Remaining: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  dependencies:
                    - name: 'SMART [{#NAME}]: Percent_Lifetime_Remain life remaining is getting low'
                      expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.percent_lifetime_remain[{#NAME}])<{$SMART.WEAR_LEVEL.AVG}
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 5b6dc631567241eab88e8daf94c75094
              name: 'SMART [{#NAME}]: Power_Cycle_Count'
              type: DEPENDENT
              key: 'smart.disk.attribute.power_cycle_count[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'This attribute indicates the count of full hard disk power on/off cycles.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.power_cycle_count.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: ada180007dd340f69d0ca78b59ca0236
              name: 'SMART [{#NAME}]: Program_Fail_Count_Chip'
              type: DEPENDENT
              key: 'smart.disk.attribute.program_fail_count_chip[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'The total number of flash program operation failures since the drive was deployed.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.program_fail_count_chip.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: d4a550eaf4ee40be96f67fcc32244264
              name: 'SMART [{#NAME}]: Raw_Read_Error_Rate'
              type: DEPENDENT
              key: 'smart.disk.attribute.raw_read_error_rate[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'Stores data related to the rate of hardware read errors that occurred when reading data from a disk surface. The raw value has different structure for different vendors and is often not meaningful as a decimal number. For some drives, this number may increase during normal operation without necessarily signifying errors.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.raw_read_error_rate.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: d832c987a08145f2be4c069285b37a3e
              name: 'SMART [{#NAME}]: Reallocated_Sector_Ct'
              type: DEPENDENT
              key: 'smart.disk.attribute.reallocated_sector_ct[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'Disk discovered attribute.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.reallocated_sector_ct.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 1ce55c53e759440eb7ea43b2f2730be1
                  expression: change(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.reallocated_sector_ct[{#NAME}])>0
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Reallocated sector count increased'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: The disk remapped more bad sectors to spare area. A steadily growing count means the disk is failing. Close manually after review.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 2fdb0fd477c44f16a204a2739a49db61
              name: 'SMART [{#NAME}]: Reported_Uncorrect'
              type: DEPENDENT
              key: 'smart.disk.attribute.reported_uncorrect[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'The count of errors that could not be recovered using hardware ECC.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.reported_uncorrect.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 340d3182326d41f398665eff36c8ae2a
                  expression: change(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.reported_uncorrect[{#NAME}])>0
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Reported uncorrectable errors increased'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: The disk reported errors that could not be recovered with ECC. Close manually after review.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: dbe2dffdd8a64c74b7b05510c81ccb2c
              name: 'SMART [{#NAME}]: Runtime_Bad_Block'
              type: DEPENDENT
              key: smart.disk.attribute.runtime_bad_block[{#NAME}]
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: Number of blocks that went bad during operation (Samsung).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.runtime_bad_block.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: smart.disk.get[{#PATH},"{#RAIDTYPE}"]
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 013499c1a871467884863a9b9a92b5d2
                  expression: change(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.runtime_bad_block[{#NAME}])>0
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Runtime bad block count increased'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: Number of blocks that went bad during operation (Samsung). Close manually after review.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 8708cddb1ac54b24b0f4baf0ded558d5
              name: 'SMART [{#NAME}]: Seek_Error_Rate'
              type: DEPENDENT
              key: 'smart.disk.attribute.seek_error_rate[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'Rate of seek errors of the magnetic heads. If there is a partial failure in the mechanical positioning system, then seek errors will arise. Such a failure may be due to numerous factors, such as damage to a servo, or thermal widening of the hard disk. The raw value has different structure for different vendors and is often not meaningful as a decimal number. For some drives, this number may increase during normal operation without necessarily signifying errors.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.seek_error_rate.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: 6be97cc2d6324d7d8ddcbb2bf3dc7318
              name: 'SMART [{#NAME}]: Spin_Up_Time'
              type: DEPENDENT
              key: 'smart.disk.attribute.spin_up_time[{#NAME}]'
              delay: '0'
              history: 7d
              discover: NO_DISCOVER
              description: 'Average time of spindle spin up (from zero RPM to fully operational [milliseconds]).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.spin_up_time.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
