                  opdata: 'Power on: {ITEM.LASTVALUE1} hours'
                  priority: AVERAGE
                  manual_close: 'YES'
                  dependencies:
                    - name: 'SMART [{#NAME}]: Disk power-on time is over {$SMART.OLDAGE.CRIT:"{#DISKTYPE}"} hours'
                      expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.hours[{#NAME}])>{$SMART.OLDAGE.CRIT:"{#DISKTYPE}"}
                  tags:
                    - tag: scope
                      value: notice
                - uuid: a61c07e606214a2fb06e0b18725444a1
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.hours[{#NAME}])>{$SMART.OLDAGE.WARN:"{#DISKTYPE}"}
                  name: 'SMART [{#NAME}]: Disk power-on time is over {$SMART.OLDAGE.WARN:"{#DISKTYPE}"} hours'
                  opdata: 'Power on: {ITEM.LASTVALUE1} hours'
                  priority: WARNING
                  manual_close: 'YES'
                  dependencies:
                    - name: 'SMART [{#NAME}]: Disk power-on time is over {$SMART.OLDAGE.AVG:"{#DISKTYPE}"} hours'
                      expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.hours[{#NAME}])>{$SMART.OLDAGE.AVG:"{#DISKTYPE}"}
                  tags:
                    - tag: scope
                      value: notice
            - uuid: ed5f1370a09d49f8a05c07a54abf42a2
              name: 'SMART [{#NAME}]: Media errors'
              type: DEPENDENT
              key: 'smart.disk.media_errors[{#NAME}]'
              delay: '0'
              history: 7d
              description: |
                Contains the number of occurrences where the controller detected
                an unrecovered data integrity error. Errors such as uncorrectable ECC, CRC
                checksum failure, or LBA tag mismatch are included in this field.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.media_errors
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: bf9218566a84481daac3febc8d06f2c2
              name: 'SMART [{#NAME}]: Device model'
              type: DEPENDENT
              key: 'smart.disk.model[{#NAME}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.model_name
                - type: STR_REPLACE
                  parameters:
                    - Samsung
                    - SMS
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: inventory
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: f0b0bd5e83484520bee5240c79a7079e
              name: 'SMART [{#NAME}]: Percentage used'
              type: DEPENDENT
              key: 'smart.disk.percentage_used[{#NAME}]'
              delay: '0'
              history: 7d
              units: '%'
              description: |
                Contains a vendor specific estimate of the percentage of NVM subsystem
                life used based on the actual usage and the manufacturer's prediction of NVM
                life. A value of 100 indicates that the estimated endurance of the NVM in
                the NVM subsystem has been consumed, but may not indicate an NVM subsystem
                failure. The value is allowed to exceed 100. Percentages greater than 254
                shall be represented as 255. This value shall be updated once per power-on
                hour (when the controller is not in a sleep state).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.percentage_used
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: d5aa28b19e42490daf05a68f1a230ced
                  expression: 'last(/SMART by Zabbix agent 2 by Silureth/smart.disk.percentage_used[{#NAME}])>90'
                  name: 'SMART [{#NAME}]: NVMe disk percentage using is over 90% of estimated endurance'
                  priority: AVERAGE
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 89bc870ae6b14e6abe353c339fc89bd9
              name: 'SMART [{#NAME}]: Serial number'
              type: DEPENDENT
              key: 'smart.disk.sn[{#NAME}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.serial_number
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: inventory
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 47ca3d01bfdc4d01bffb703b172e2543
                  expression: 'last(/SMART by Zabbix agent 2 by Silureth/smart.disk.sn[{#NAME}],#1)<>last(/SMART by Zabbix agent 2 by Silureth/smart.disk.sn[{#NAME}],#2) and length(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.sn[{#NAME}]))>0'
                  name: 'SMART [{#NAME}]: Disk has been replaced'
                  event_name: 'SMART [{#NAME}]: Disk has been replaced (new serial number received)'
                  priority: INFO
                  description: 'Device serial number has changed. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 91e25a2de91d4f42ad2fee01c2d03aca
              name: 'SMART [{#NAME}]: Temperature'
              type: DEPENDENT
              key: 'smart.disk.temperature[{#NAME}]'
              delay: '0'
              history: 7d
              units: °C
              description: 'Current drive temperature.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.temperature
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: temperature
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 4c71f06498e743d484c532cdbcff49b2
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.temperature[{#NAME}])>{$SMART.TEMPERATURE.MAX.CRIT}
                  name: 'SMART [{#NAME}]: Disk temperature is critical'
                  event_name: 'SMART [{#NAME}]: Disk temperature is critical (over {$SMART.TEMPERATURE.MAX.CRIT}°C)'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 3928b3592e2b4ac7bb9be18ecc4e0df1
                  expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.temperature[{#NAME}])>{$SMART.TEMPERATURE.MAX.WARN}
                  name: 'SMART [{#NAME}]: Disk temperature is too high'
                  event_name: 'SMART [{#NAME}]: Disk temperature is too high (over {$SMART.TEMPERATURE.MAX.WARN}°C)'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  dependencies:
                    - name: 'SMART [{#NAME}]: Disk temperature is critical'
                      expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.temperature[{#NAME}])>{$SMART.TEMPERATURE.MAX.CRIT}
                  tags:
                    - tag: scope
                      value: notice
            - uuid: fd1bad446a5044d198ad4c9b3e89bf22
              name: 'SMART [{#NAME}]: Self-test in progress'
              type: DEPENDENT
              key: smart.disk.test.progress[{#NAME}]
              delay: '0'
              history: 7d
              value_type: CHAR
              description: Reports if the disk is currently running a SMART self-test.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.self_test_in_progress
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: smart.disk.get[{#PATH},"{#RAIDTYPE}"]
              tags:
                - tag: component
                  value: health
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trends: '0'
            - uuid: 665e7cbcd8354c90b1e8f149b1dffedf
              name: 'SMART [{#NAME}]: Self-test passed'
              type: DEPENDENT
              key: 'smart.disk.test[{#NAME}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              description: 'The disk is passed the SMART self-test or not.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.self_test_passed
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: health
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
          trigger_prototypes:
            - uuid: 1aea8bfbe39b4f559323cd14863570a2
              expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.test[{#NAME}])="false" and last(/SMART by Zabbix agent 2 by Silureth/smart.disk.test.progress[{#NAME}])="false"
              name: 'SMART [{#NAME}]: Disk self-test is not passed'
              opdata: 'Result: {ITEM.LASTVALUE1}, test in progress: {ITEM.LASTVALUE2}'
              priority: HIGH
              tags:
                - tag: scope
                  value: notice
            - uuid: bf3c0521a6394eb4a554c71b01be2040
              expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.total_lbas_written[{#NAME}])>{$SMART.TBW.SUSPECT:"{#NAME}"} and last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.media_wearout_indicator[{#NAME}])>=99
              name: 'SMART [{#NAME}]: Media_Wearout_Indicator shows no wear after heavy writes'
              event_name: 'SMART [{#NAME}]: Media_Wearout_Indicator shows no wear after heavy writes (>{$SMART.TBW.SUSPECT:"{#NAME}"} written)'
              opdata: 'Written: {ITEM.LASTVALUE1}, remaining: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'More than {$SMART.TBW.SUSPECT} has been written, but the wear counter still shows 99-100% life remaining. The counter is probably not tracking real wear, so judge the disk by its age and bytes written. For enterprise SSDs rated for many petabytes raise {$SMART.TBW.SUSPECT:"<disk name>"} on the host.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
            - uuid: 97ac0c65a3dd4ef7ae81b572075fb200
              expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.total_lbas_written[{#NAME}])>{$SMART.TBW.SUSPECT:"{#NAME}"} and last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.percent_lifetime_remain[{#NAME}])>=99
              name: 'SMART [{#NAME}]: Percent_Lifetime_Remain shows no wear after heavy writes'
              event_name: 'SMART [{#NAME}]: Percent_Lifetime_Remain shows no wear after heavy writes (>{$SMART.TBW.SUSPECT:"{#NAME}"} written)'
              opdata: 'Written: {ITEM.LASTVALUE1}, remaining: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'More than {$SMART.TBW.SUSPECT} has been written, but the wear counter still shows 99-100% life remaining. The counter is probably not tracking real wear, so judge the disk by its age and bytes written. For enterprise SSDs rated for many petabytes raise {$SMART.TBW.SUSPECT:"<disk name>"} on the host.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
            - uuid: 49c5f219a7b34e7a89650dc183c908ed
              expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.total_lbas_written[{#NAME}])>{$SMART.TBW.SUSPECT:"{#NAME}"} and last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.ssd_life_left[{#NAME}])>=99
              name: 'SMART [{#NAME}]: SSD_Life_Left shows no wear after heavy writes'
              event_name: 'SMART [{#NAME}]: SSD_Life_Left shows no wear after heavy writes (>{$SMART.TBW.SUSPECT:"{#NAME}"} written)'
              opdata: 'Written: {ITEM.LASTVALUE1}, remaining: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'More than {$SMART.TBW.SUSPECT} has been written, but the wear counter still shows 99-100% life remaining. The counter is probably not tracking real wear, so judge the disk by its age and bytes written. For enterprise SSDs rated for many petabytes raise {$SMART.TBW.SUSPECT:"<disk name>"} on the host.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
            - uuid: 20119120c7db493db432c4750e49da78
              expression: last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.total_lbas_written[{#NAME}])>{$SMART.TBW.SUSPECT:"{#NAME}"} and last(/SMART by Zabbix agent 2 by Silureth/smart.disk.attribute.wear_leveling_count[{#NAME}])>=99
              name: 'SMART [{#NAME}]: Wear_Leveling_Count shows no wear after heavy writes'
              event_name: 'SMART [{#NAME}]: Wear_Leveling_Count shows no wear after heavy writes (>{$SMART.TBW.SUSPECT:"{#NAME}"} written)'
              opdata: 'Written: {ITEM.LASTVALUE1}, remaining: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'More than {$SMART.TBW.SUSPECT} has been written, but the wear counter still shows 99-100% life remaining. The counter is probably not tracking real wear, so judge the disk by its age and bytes written. For enterprise SSDs rated for many petabytes raise {$SMART.TBW.SUSPECT:"<disk name>"} on the host.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
          overrides:
            - name: Self-test
              step: '1'
              filter:
                conditions:
                  - macro: '{#DISKTYPE}'
                    value: nvme
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: Self-test
                  discover: NO_DISCOVER
            - name: 'Not NVMe'
              step: '2'
              filter:
                conditions:
                  - macro: '{#DISKTYPE}'
                    value: nvme
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Percentage|Critical
                  discover: NO_DISCOVER
            - name: Raw_Read_Error_Rate
              step: '3'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Raw_Read_Error_Rate
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Raw_Read_Error_Rate
                  discover: DISCOVER
            - name: Spin_Up_Time
              step: '4'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Spin_Up_Time
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Spin_Up_Time
                  discover: DISCOVER
            - name: Start_Stop_Count
              step: '5'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Start_Stop_Count
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Start_Stop_Count
                  discover: DISCOVER
            - name: Power_Cycle_Count
              step: '6'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Power_Cycle_Count
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Power_Cycle_Count
                  discover: DISCOVER
            - name: Reported_Uncorrect
              step: '7'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Reported_Uncorrect
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Reported_Uncorrect
                  discover: DISCOVER
            - name: Seek_Error_Rate
              step: '8'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Seek_Error_Rate
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Seek_Error_Rate
                  discover: DISCOVER
            - name: Bad_Block_Rate
              step: '9'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Bad_Block_Rate
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Bad_Block_Rate
                  discover: DISCOVER
            - name: Program_Fail_Count_Chip
              step: '10'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Program_Fail_Count_Chip
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Program_Fail_Count_Chip
                  discover: DISCOVER
            - name: Reallocated_Sector_Ct
              step: '11'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Reallocated_Sector_Ct
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Reallocated_Sector_Ct
                  discover: DISCOVER
            - name: Wear_Leveling_Count
              step: '12'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Wear_Leveling_Count
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Wear_Leveling_Count
                  discover: DISCOVER
            - name: SSD_Life_Left
              step: '13'
              filter:
