                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 883e907f161e4ae8a6b71fe1e69e56bb
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),16) = 16 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),16) = 16
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),16) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),16) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Some prefail Attributes <= threshold'
                  priority: HIGH
                  description: 'We found prefail Attributes <= threshold.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: fa1dab152fb14b7b946b3a4a152d1af1
              name: 'SMART [{#NAME}]: Get disk attributes'
              key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              delay: '{$SMART.DISK.GET.INTERVAL}'
