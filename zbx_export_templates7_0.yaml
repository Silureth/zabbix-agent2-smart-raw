            - uuid: 8f57bb60a196475a9869ef6ea55195a0
              name: 'SMART [{#NAME}]: Total bytes written'
              type: DEPENDENT
              key: 'smart.disk.attribute.total_lbas_written[{#NAME}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              discover: NO_DISCOVER
              description: |-
                Total bytes written by the host. Taken from Total_LBAs_Written multiplied by {$SMART.TBW.UNIT.BYTES}
                (512 by default), or from Host_Writes_GiB when the disk only reports that.
                Some disks (e.g. WD Red SA500) report Total_LBAs_Written in GiB: set
                {$SMART.TBW.UNIT.BYTES:"<disk name>"} = 1073741824 on the host for those.
                No write-limit triggers: SSD wear is alerted by the wear-level items, and fixed write limits
                do not fit large disks or HDDs. It is only used to flag a wear counter that does not move:
                more than {$SMART.TBW.SUSPECT} written while the wear item still shows 99-100% remaining.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |-
                      var d = JSON.parse(value);
                      if (d.total_lbas_written) {
                          return d.total_lbas_written.value * {$SMART.TBW.UNIT.BYTES:"{#NAME}"};
                      }
                      if (d.host_writes_gib) {
                          return d.host_writes_gib.value * 1073741824;
                      }
                      throw 'Neither Total_LBAs_Written nor Host_Writes_GiB is reported by this disk';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              units: B
