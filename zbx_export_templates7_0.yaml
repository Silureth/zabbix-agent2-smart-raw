                  discover: DISCOVER
      tags:
        - tag: class
          value: storage
        - tag: target
          value: hdd
        - tag: target
          value: ssd
      macros:
        - macro: '{$SMART.DISK.GET.INTERVAL}'
          value: 1h
          description: 'How often to poll SMART data per disk. 1h is sufficient — disk failures are reported by ILO/iDRAC; SMART is for trend monitoring only.'
        - macro: '{$SMART.DISK.NAME.MATCHES}'
          value: '^.*$'
          description: 'This macro is used in the filter of attribute and disk discoveries. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.DISK.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Excludes disks from discovery by name regex. Override per host to deduplicate RAID setups where the same physical disk appears under multiple paths. On HP Smart Array (cciss) hosts set it to " scsi$" to drop the controller logical volume, which has no SMART data.'
        - macro: '{$SMART.OLDAGE.AVG}'
          value: '87600'
          description: 'Average-severity alert when an HDD''s power-on hours exceed this (87600 h ~ 10 years). The context is the disk type: override on a host with {$SMART.OLDAGE.AVG:"hdd"}.'
        - macro: '{$SMART.OLDAGE.AVG:regex:"^(ssd|nvme)$"}'
          value: '61320'
          description: 'Average-severity alert when an SSD''s or NVMe''s power-on hours exceed this (61320 h ~ 7 years). Override on a host with {$SMART.OLDAGE.AVG:"ssd"} or {$SMART.OLDAGE.AVG:"nvme"}.'
        - macro: '{$SMART.OLDAGE.CRIT}'
          value: '105120'
          description: 'High-severity alert when an HDD''s power-on hours exceed this (105120 h ~ 12 years). The context is the disk type: override on a host with {$SMART.OLDAGE.CRIT:"hdd"}.'
        - macro: '{$SMART.OLDAGE.CRIT:regex:"^(ssd|nvme)$"}'
          value: '70080'
          description: 'High-severity alert when an SSD''s or NVMe''s power-on hours exceed this (70080 h ~ 8 years). Override on a host with {$SMART.OLDAGE.CRIT:"ssd"} or {$SMART.OLDAGE.CRIT:"nvme"}.'
        - macro: '{$SMART.OLDAGE.WARN}'
          value: '70080'
          description: 'Warning when an HDD''s power-on hours exceed this (70080 h ~ 8 years). The context is the disk type: override on a host with {$SMART.OLDAGE.WARN:"hdd"}.'
        - macro: '{$SMART.OLDAGE.WARN:regex:"^(ssd|nvme)$"}'
          value: '52560'
          description: 'Warning when an SSD''s or NVMe''s power-on hours exceed this (52560 h ~ 6 years). Age is a secondary indicator for SSDs: it still alerts when the wear counter stays at 0% on a worn disk. Override on a host with {$SMART.OLDAGE.WARN:"ssd"} or {$SMART.OLDAGE.WARN:"nvme"}.'
        - macro: '{$SMART.TBW.SUSPECT}'
          value: '500T'
          description: 'Average-severity alert when more than this has been written but the SSD''s wear counter still shows 99-100% life remaining, which means the counter is probably not tracking real wear. Supports K/M/G/T suffixes (1024-based). Raise it per disk for enterprise SSDs rated for many petabytes, e.g. {$SMART.TBW.SUSPECT:"sda cciss,0"} = 5000T.'
        - macro: '{$SMART.TBW.UNIT.BYTES}'
          value: '512'
          description: Bytes per Total_LBAs_Written unit. Override per disk with context for disks that report it in GiB, e.g. {$SMART.TBW.UNIT.BYTES:"sde cciss,3"} = 1073741824.
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT}'
          value: '65'
          description: 'This macro is used for trigger expression. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN}'
          value: '52'
