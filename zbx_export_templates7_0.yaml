                  - macro: '{#ATTRIBUTES}'
                    value: (^| )(Total_LBAs_Written|Host_Writes_GiB)( |$)
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: ': Total bytes written$'
                  discover: DISCOVER
            - name: Media_Wearout_Indicator
              step: '15'
