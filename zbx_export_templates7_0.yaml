            - uuid: 14c029d3439b4e0d9bc778def4cff952
              name: 'SMART [{#NAME}]: Exit status'
              type: DEPENDENT
              key: 'smart.disk.es[{#NAME}]'
              delay: '0'
              history: 7d
              description: |
                The exit statuses of smartctl are defined by a bitmask but in decimal value. The eight different bits in the exit status have the following  meanings  for  ATA disks; some of these values may also be returned for SCSI disks.
                Bit 0: Command line did not parse.
                Bit 1: Device  open failed, device did not return an IDENTIFY DEVICE structure, or device is in a low-power mode (see '-n' option above).
                Bit 2: Some SMART or other ATA command to the disk failed, or there was a checksum error in a SMART data  structure  (see '-b' option above).
                Bit 3: SMART status check returned "DISK FAILING".
                Bit 4: We found prefail Attributes <= threshold.
                Bit 5: SMART  status  check returned "DISK OK" but we found that some (usage or prefail) Attributes have been <= threshold at some time in the past.
                Bit 6: The device error log contains records of errors.
                Bit 7: The device self-test log contains records of errors. [ATA only] Failed self-tests outdated by a newer successful extended self-test are ignored.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.exit_status
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 45166f3caef94712ba5b59f0f4849e98
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),8) = 8 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),8) = 8
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),8) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),8) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Check returned "DISK FAILING"'
                  priority: HIGH
                  description: 'SMART status check returned "DISK FAILING".'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 2fde4363197e442e80afd69cd3615655
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),1) = 1 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),1) = 1
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),1) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),1) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Command line did not parse'
                  priority: HIGH
                  description: 'Command line did not parse.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 22b50e5a4fa540ff81a4be0c63db2c1f
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),2) = 2 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),2) = 2
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),2) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),2) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Device open failed'
                  priority: HIGH
                  description: 'Device open failed, device did not return an IDENTIFY DEVICE structure, or device is in a low-power mode.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 1c53311985894a77979c05869a6f41e0
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),64) = 64 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),64) = 64
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),64) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),64) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Error log contains records'
                  priority: HIGH
                  description: 'The device error log contains records of errors.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 759263481f36467b9020bfa63435a6de
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),128) = 128 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),128) = 128
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),128) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),128) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Self-test log contains records'
                  priority: HIGH
                  description: |
                    The device self-test log contains records of errors. [ATA only]
                    Failed self-tests outdated by a newer successful extended self-test are ignored.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 9f9bf89901b249b0925176497553a237
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),32) = 32 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),32) = 32
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),32) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),32) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Some Attributes have been <= threshold'
                  priority: HIGH
                  description: |
                    SMART status check returned "DISK OK" but we found that some (usage
                    or prefail) Attributes have been <= threshold at some time in the past.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: a2e87cb2359d444099f7effee50dd113
                  expression: |
                    ( count(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),4) = 4 )
                    or ( bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),4) = 4
                    and bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}]),4) > bitand(last(/SMART by Zabbix agent 2 by Silureth/smart.disk.es[{#NAME}],#2),4) )
                  recovery_mode: NONE
                  name: 'SMART [{#NAME}]: Some command to the disk failed'
                  status: DISABLED
                  discover: NO_DISCOVER
                  priority: HIGH
                  description: |
                    Some SMART or other ATA command to the disk failed,
