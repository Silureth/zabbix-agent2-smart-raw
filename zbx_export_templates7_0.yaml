                  - macro: '{#ATTRIBUTES}'
                    value: (^| )Offline_Uncorrectable( |$)
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: ': Offline_Uncorrectable$'
                  discover: DISCOVER
            - name: Uncorrectable_Error_Cnt
              step: '19'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: (^| )Uncorrectable_Error_Cnt( |$)
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: ': Uncorrectable_Error_Cnt$'
                  discover: DISCOVER
            - name: Runtime_Bad_Block
