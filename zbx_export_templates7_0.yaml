        - macro: '{$SMART.WEAR_LEVEL.AVG}'
          value: '20'
          description: 'Average-severity alert when an SSD has less than this % of its rated endurance left (all vendors).'
        - macro: '{$SMART.WEAR_LEVEL.CRIT}'
          value: '10'
          description: 'High-severity alert when an SSD has less than this % of its rated endurance left (all vendors).'
        - macro: '{$SMART.WEAR_LEVEL.WARN}'
          value: '30'
          description: 'Warning when an SSD has less than this % of its rated endurance left (all vendors).'
